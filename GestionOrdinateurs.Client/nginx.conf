server {
	listen 5159;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	resolver 127.0.0.11 valid=30s ipv6=off;

	location /auth/ {
		set $auth_api authentification_api:5157;
		proxy_pass http://$auth_api;
	}

	location /api/ {
		set $gateway go_gateway:5160;
		proxy_pass http://$gateway;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}