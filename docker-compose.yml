services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: GestionOrdinateursDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - appnet

  authentification_api:
    image: ${DOCKER_ACCOUNT}/authentification_api:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    container_name: authentification_api
    ports:
      - "5157:5157"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5157
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:?Définissez KEYCLOAK_CLIENT_SECRET dans .env}
    depends_on:
      - postgres
      - keycloak
      - go_api
    networks:
      - appnet

  go_api:
    image: ${DOCKER_ACCOUNT}/go_api:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    container_name: go_api
    ports:
      - "5158:5158"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5158
      ConnectionStrings__ParcInformatique: "Data Source=/data/parcinfo.db"
    volumes:
      - go_api_data:/data
    depends_on:
      - postgres
      - keycloak
    networks:
      - appnet

  go_client:
    image: ${DOCKER_ACCOUNT}/go_client:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    container_name: go_client
    ports:
      - "5159:5159"
    depends_on:
      - authentification_api
      - go_gateway
    networks:
      - appnet

  go_gateway:
    image: ${DOCKER_ACCOUNT}/go_gateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    container_name: go_gateway
    ports:
      - "5160:5160"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5160
    depends_on:
      - postgres
      - keycloak
      - go_api
    networks:
      - appnet
networks:
  appnet:

volumes:
  postgres_data:
  keycloak_data:
  go_api_data: